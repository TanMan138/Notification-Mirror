name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Only the publishing job may write; the build jobs handle signing material and
# get read-only tokens.
permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Test and lint
        working-directory: android
        run: ./gradlew testDebugUnitTest lint

      # Also runs on workflow_dispatch, so a dry run exercises the real signing
      # path rather than silently producing an unsigned build.
      - name: Restore the keystore
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > release.jks

      - name: Build the APK
        working-directory: android
        env:
          RELEASE_STORE_FILE: release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          REF_NAME: ${{ github.ref_name }}
          IS_TAG: ${{ github.ref_type == 'tag' }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          if [ "$IS_TAG" = "true" ]; then
            export VERSION_NAME="${REF_NAME#v}"
          else
            export VERSION_NAME="0.0.0-dev"
          fi
          ./gradlew assembleRelease

      # The unsigned build lands under a different name, so its absence is the
      # signing check. The grep looks for a real project ref, not the
      # ".supabase.co" suffix constant the app legitimately contains.
      - name: Refuse to publish an unsigned or credential-bearing APK
        working-directory: android
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          test -f "$apk" || { echo "release APK is not signed"; exit 1; }
          if unzip -p "$apk" 'classes*.dex' | LC_ALL=C grep -a -q -E \
             'https://[a-z0-9]{15,}\.supabase\.co|sb_publishable_[A-Za-z0-9_-]{20,}'; then
            echo "APK contains baked-in Supabase credentials"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android/app/build/outputs/apk/release/app-release.apk

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # Gitignored, and the project fails to open without it.
      - name: Create an empty credentials file
        working-directory: macos
        run: printf 'SUPABASE_HOST = \nSUPABASE_PUBLISHABLE_KEY = \n' > Secrets.xcconfig

      - name: Test
        working-directory: macos
        run: |
          xcodebuild -project AndroidNotificationMirror.xcodeproj \
            -scheme AndroidNotificationMirror -destination 'platform=macOS' test

      # Ad-hoc signing keeps the bundle intact. It is not notarized, so first
      # launch needs the Gatekeeper steps in the README.
      - name: Build the app
        working-directory: macos
        run: |
          xcodebuild -project AndroidNotificationMirror.xcodeproj \
            -scheme AndroidNotificationMirror -configuration Release \
            -derivedDataPath build CODE_SIGN_IDENTITY="-" \
            CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="" build

      # A disk image with an Applications shortcut. Running an unsigned app from
      # Downloads triggers App Translocation, which relocates it to a read-only
      # path; dragging it to Applications first avoids that.
      - name: Package a disk image
        working-directory: macos
        run: |
          mkdir -p dmg-root
          cp -R build/Build/Products/Release/AndroidNotificationMirror.app dmg-root/
          ln -s /Applications dmg-root/Applications
          hdiutil create -volname "Notification Mirror" -srcfolder dmg-root \
            -ov -format UDZO AndroidNotificationMirror.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: macos/AndroidNotificationMirror.dmg

  publish:
    needs: [android, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      # Pinned to a commit: a moved tag on a third-party action would otherwise
      # run unreviewed code with a release-writing token.
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            artifacts/android-apk/app-release.apk
            artifacts/macos-app/AndroidNotificationMirror.dmg
